<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b85c38">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>La Mia Cucina</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f1ea;
    color: #333;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  h1 { text-align: center; margin-bottom: 5px; color: #b85c38; font-size: 24px; }
  .header-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .converter-btn {
    background: #2196f3;
    color: white;
    padding: 8px 14px;
    font-size: 13px;
    border-radius: 20px;
  }
  .converter-btn:hover { background: #1976d2; }
  .sync-status {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin-bottom: 15px;
  }
  .sync-status.ok { color: #2e7d32; }
  .sync-status.err { color: #c0392b; }
  .sync-status.loading { color: #f57c00; }
  .tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
    border-bottom: 2px solid #b85c38;
    flex-wrap: wrap;
  }
  .tab {
    padding: 12px 20px;
    cursor: pointer;
    background: #e8ddd0;
    border: none;
    border-radius: 8px 8px 0 0;
    font-size: 15px;
    font-weight: 600;
    color: #666;
    transition: all 0.2s;
    flex: 1;
    min-width: 100px;
  }
  .tab.active { background: #b85c38; color: white; }
  .panel { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .panel.active { display: block; }
  .form-row { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  input, select, button {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
  }
  input[type="text"], input[type="number"] { flex: 1; min-width: 80px; }
  select { min-width: 100px; }
  button {
    background: #b85c38;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }
  button:hover { background: #9a4a2d; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  button.small { padding: 6px 10px; font-size: 12px; background: #ccc; }
  button.small:hover { background: #999; }
  button.danger { background: #c0392b; }
  button.danger:hover { background: #922b21; }
  button.edit { background: #2196f3; }
  button.edit:hover { background: #1976d2; }
  button.save { background: #4caf50; }
  button.save:hover { background: #388e3c; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    background: #fafafa;
    border-radius: 6px;
    margin-bottom: 8px;
    border-left: 4px solid #b85c38;
  }
  .item.necessario { border-left-color: #2196f3; }
  .item.mismatch { border-left-color: #ff9800; background: #fff8e1; }
  .item.editing {
    background: #fff9e6;
    border-left-color: #ffc107;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; word-break: break-word; }
  .item-qty { color: #666; font-size: 13px; }
  .item-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .edit-form-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .edit-form-row input, .edit-form-row select { flex: 1; min-width: 70px; }
  .edit-form-actions { display: flex; gap: 6px; }
  .shopping-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: #fff3e0;
    border-radius: 6px;
    margin-bottom: 8px;
    border-left: 4px solid #ff9800;
  }
  .shopping-item.checked {
    background: #e8f5e9;
    border-left-color: #4caf50;
    opacity: 0.7;
  }
  .shopping-item.checked .item-name {
    text-decoration: line-through;
    color: #666;
  }
  .shopping-item.mismatch {
    background: #ffebee;
    border-left-color: #c0392b;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .shopping-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .shopping-item-content {
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 0;
  }
  .mismatch-error {
    background: #ffebee;
    border-left: 4px solid #c0392b;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    color: #8b0000;
    font-size: 13px;
    font-weight: 600;
  }
  .empty { text-align: center; color: #999; padding: 30px; font-style: italic; }
  .section-title { margin-bottom: 15px; color: #555; }
  .base-list {
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 15px;
    max-height: 250px;
    overflow-y: auto;
  }
  .base-item {
    padding: 8px 10px;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s;
  }
  .base-item:hover { background: #e8ddd0; }
  .toggle-suggestions {
    background: #6c757d;
    font-size: 12px;
    padding: 6px 12px;
    margin-bottom: 10px;
  }
  .toggle-suggestions:hover { background: #5a6268; }
  .export-buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
  }
  .export-buttons button {
    flex: 1;
    min-width: 120px;
  }
  .export-btn-copy { background: #607d8b; }
  .export-btn-copy:hover { background: #455a64; }
  .export-btn-share { background: #25d366; }
  .export-btn-share:hover { background: #1da851; }
  .export-btn-open { background: #9c27b0; }
  .export-btn-open:hover { background: #7b1fa2; }

  /* RICETTE */
  .recipes-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .recipes-list-panel {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .recipe-editor-panel {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .recipe-card {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .recipe-card:hover {
    background: #f0f0f0;
    border-color: #b85c38;
  }
  .recipe-card.active {
    background: #fff3e0;
    border-color: #b85c38;
    border-width: 2px;
  }
  .recipe-card-title {
    font-weight: 600;
    color: #b85c38;
    margin-bottom: 5px;
    word-break: break-word;
  }
  .recipe-card-count {
    font-size: 12px;
    color: #666;
  }
  .recipe-card-actions {
    display: flex;
    gap: 5px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .recipe-ingredient-item {
    display: flex;
    align-items: center;
    padding: 8px;
    background: #fafafa;
    border-radius: 4px;
    margin-bottom: 6px;
    border-left: 3px solid #9c27b0;
  }
  .recipe-ingredient-item.editing {
    background: #fff9e6;
    border-left-color: #ffc107;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .recipe-ingredient-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-right: 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .recipe-ingredient-info {
    flex: 1;
    min-width: 0;
  }
  .select-all-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #e8f5e9;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .select-all-row label {
    font-weight: 600;
    color: #2e7d32;
  }

  /* MODAL CALCOLATRICE */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 25px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    color: #2196f3;
    margin-bottom: 15px;
    text-align: center;
    font-size: 20px;
  }
  .modal-close {
    float: right;
    background: #ccc;
    color: #333;
    padding: 4px 10px;
    font-size: 14px;
    border-radius: 50%;
    line-height: 1;
  }
  .modal-close:hover { background: #999; }
  .conv-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
  }
  .conv-row label {
    min-width: 50px;
    font-weight: 600;
    color: #555;
  }
  .conv-row input, .conv-row select { flex: 1; }
  .conv-result {
    background: #e3f2fd;
    border-left: 4px solid #2196f3;
    padding: 15px;
    border-radius: 6px;
    margin-top: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #1565c0;
    word-break: break-word;
  }
  .conv-result.error {
    background: #ffebee;
    border-left-color: #c0392b;
    color: #8b0000;
    font-size: 14px;
    font-weight: 600;
  }
  .swap-btn {
    background: #6c757d;
    padding: 6px 12px;
    font-size: 16px;
    margin: 0 auto;
    display: block;
  }
  .swap-btn:hover { background: #5a6268; }

  /* RESPONSIVE MOBILE */
  @media (max-width: 768px) {
    body {
      padding: 10px;
      font-size: 16px;
    }
    h1 {
      font-size: 22px;
    }
    .tabs {
      gap: 3px;
    }
    .tab {
      padding: 10px 8px;
      font-size: 13px;
      min-width: 70px;
    }
    .panel {
      padding: 15px;
      border-radius: 6px;
    }
    .form-row {
      gap: 6px;
    }
    input, select, button {
      padding: 10px;
      font-size: 16px;
    }
    button.small {
      padding: 8px 12px;
      font-size: 14px;
    }
    .item {
      padding: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .item-actions {
      width: 100%;
      justify-content: flex-end;
    }
    .recipes-container {
      grid-template-columns: 1fr;
      gap: 15px;
    }
    .recipe-card {
      padding: 12px;
    }
    .recipe-ingredient-item {
      padding: 10px;
      flex-wrap: wrap;
    }
    .recipe-ingredient-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
    }
    .shopping-item {
      padding: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .shopping-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
    }
    .modal {
      padding: 20px;
      margin: 10px;
    }
    .modal h2 {
      font-size: 18px;
    }
    .conv-result {
      font-size: 16px;
    }
    .edit-form-row {
      flex-direction: column;
    }
    .edit-form-row input, .edit-form-row select {
      min-width: 100%;
    }
    .edit-form-actions {
      width: 100%;
    }
    .edit-form-actions button {
      flex: 1;
    }
    .export-buttons {
      flex-direction: column;
    }
    .export-buttons button {
      min-width: 100%;
    }
  }

  @media (hover: none) and (pointer: coarse) {
    button, .tab, .base-item, .recipe-card {
      min-height: 44px;
    }
    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
    }
  }
</style>
</head>
<body>

<h1>🍳 La Mia Cucina</h1>
<div class="header-row">
  <button class="converter-btn" onclick="openConverter()">🧮 Converti unità</button>
</div>
<div id="sync-status" class="sync-status loading">⏳ Connessione a Firebase...</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('dispensa', event)">📦 Dispensa</button>
  <button class="tab" onclick="showTab('necessario', event)">📋 Necessario</button>
  <button class="tab" onclick="showTab('ricette', event)">📖 Ricette</button>
  <button class="tab" onclick="showTab('spesa', event)">🛒 Spesa</button>
</div>

<!-- DISPENSA -->
<div id="dispensa" class="panel active">
  <h2 class="section-title">Aggiungi ingrediente</h2>
  <button class="toggle-suggestions" onclick="toggleSuggestions('dispensa')">📋 Mostra/Nascondi lista ingredienti</button>
  <div id="dispensa-suggestions" class="base-list" style="display:none;"></div>
  <div class="form-row">
    <input type="text" id="ing-name" placeholder="Nome ingrediente (es. Pasta)" list="ing-list">
    <datalist id="ing-list"></datalist>
    <input type="number" id="ing-qty" placeholder="Qtà" min="0" step="0.1" style="max-width:100px;">
    <select id="ing-unit">
      <option value="pz">pz</option>
      <option value="g">g</option>
      <option value="kg">kg</option>
      <option value="ml">ml</option>
      <option value="l">l</option>
      <option value="cucchiai">cucchiai</option>
      <option value="cucchiaini">cucchiaini</option>
      <option value="confezioni">conf.</option>
    </select>
    <button onclick="addToPantry()">➕ Aggiungi</button>
  </div>
  <button class="danger" onclick="clearPantry()" style="margin-bottom:15px;">🗑️ SVUOTA DISPENSA</button>
  <h2 class="section-title">Hai in dispensa</h2>
  <div id="pantry-list"></div>
</div>

<!-- NECESSARIO -->
<div id="necessario" class="panel">
  <h2 class="section-title">Aggiungi ingrediente necessario</h2>
  <button class="toggle-suggestions" onclick="toggleSuggestions('necessario')">📋 Mostra/Nascondi lista ingredienti</button>
  <div id="necessario-suggestions" class="base-list" style="display:none;"></div>
  <div class="form-row">
    <input type="text" id="nec-name" placeholder="Nome ingrediente (es. Pasta)" list="ing-list">
    <input type="number" id="nec-qty" placeholder="Qtà" min="0" step="0.1" style="max-width:100px;">
    <select id="nec-unit">
      <option value="pz">pz</option>
      <option value="g">g</option>
      <option value="kg">kg</option>
      <option value="ml">ml</option>
      <option value="l">l</option>
      <option value="cucchiai">cucchiai</option>
      <option value="cucchiaini">cucchiaini</option>
      <option value="confezioni">conf.</option>
    </select>
    <button onclick="addToNeeded()">➕ Aggiungi</button>
  </div>
  <button class="danger" onclick="clearNeeded()" style="margin-bottom:15px;">🗑️ SVUOTA NECESSARIO</button>
  <h2 class="section-title">Ingredienti necessari</h2>
  <div id="needed-list"></div>
</div>

<!-- RICETTE -->
<div id="ricette" class="panel">
  <div class="recipes-container">
    <div class="recipes-list-panel">
      <h2 class="section-title">Le mie ricette</h2>
      <button onclick="newRecipe()" style="width:100%; margin-bottom:15px; background:#9c27b0;">➕ Nuova ricetta</button>
      <div id="recipes-list"></div>
    </div>

    <div class="recipe-editor-panel">
      <div id="recipe-editor">
        <div class="empty">Seleziona una ricetta o creane una nuova</div>
      </div>
    </div>
  </div>
</div>

<!-- SPESA -->
<div id="spesa" class="panel">
  <div id="shopping-result"></div>
  <div id="export-buttons-container"></div>
</div>

<!-- MODAL CALCOLATRICE -->
<div id="converter-modal" class="modal-overlay" onclick="if(event.target===this) closeConverter()">
  <div class="modal">
    <button class="modal-close" onclick="closeConverter()">✕</button>
    <h2>🧮 Converti unità di misura</h2>

    <div class="conv-row">
      <label>Da:</label>
      <input type="number" id="conv-value" placeholder="Valore" step="0.01" min="0" oninput="convert()">
    </div>
    <div class="conv-row">
      <label>Unità:</label>
      <select id="conv-from" onchange="convert()">
        <option value="g">g</option>
        <option value="kg">kg</option>
        <option value="ml">ml</option>
        <option value="l">l</option>
        <option value="cucchiai">cucchiai</option>
        <option value="cucchiaini">cucchiaini</option>
        <option value="pz">pz</option>
        <option value="confezioni">conf.</option>
      </select>
    </div>

    <button class="swap-btn" onclick="swapUnits()" title="Inverti">⇅ Inverti</button>

    <div class="conv-row" style="margin-top:12px;">
      <label>A:</label>
      <select id="conv-to" onchange="convert()">
        <option value="g">g</option>
        <option value="kg" selected>kg</option>
        <option value="ml">ml</option>
        <option value="l">l</option>
        <option value="cucchiai">cucchiai</option>
        <option value="cucchiaini">cucchiaini</option>
        <option value="pz">pz</option>
        <option value="confezioni">conf.</option>
      </select>
    </div>

    <div id="conv-result" class="conv-result">Inserisci un valore</div>
  </div>
</div>

<script>
// ============================================================
// 🔥 CONFIGURAZIONE FIREBASE
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAmttJRN9YiQkZd0evhYLwfu3fu5J821qE",
  authDomain: "cucina-dispensa-spesa.firebaseapp.com",
  projectId: "cucina-dispensa-spesa",
  storageBucket: "cucina-dispensa-spesa.firebasestorage.app",
  messagingSenderId: "904852261111",
  appId: "1:904852261111:web:b1916de0354257023cabf2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ============================================================
// LISTA BASE PREDEFINITA
// ============================================================
const DEFAULT_INGREDIENTS = [
  "Pasta", "Riso", "Farina", "Farina integrale", "Pane",
  "Olio extravergine d'oliva", "Olio di semi", "Burro",
  "Sale", "Pepe", "Zucchero", "Aceto",
  "Pomodoro", "Pomodori pelati", "Passata di pomodoro", "Concentrato di pomodoro",
  "Cipolla", "Aglio", "Carota", "Sedano", "Zucchina", "Melanzana", "Patata", "Peperone",
  "Insalata", "Spinaci", "Broccoli",
  "Basilico", "Prezzemolo", "Rosmarino", "Salvia", "Timo", "Origano",
  "Uova", "Latte", "Panna",
  "Parmigiano", "Mozzarella", "Ricotta", "Gorgonzola",
  "Tonno in scatola", "Salmone",
  "Fagioli", "Ceci", "Lenticchie", "Piselli",
  "Limone", "Lievito",
  "Miele", "Marmellata",
  "Besciamella", "Brodo"
];

// ============================================================
// STATO
// ============================================================
let pantry = {};
let needed = {};
let recipes = [];
let ingredientBase = [];
let firebaseReady = false;
let shoppingChecked = new Set();
let currentRecipeId = null;
let tempRecipeIngredients = [];
let selectedRecipeIngredients = new Set();
let editingRecipeIngredientIndex = null;
let tempRecipeName = ''; // Nome temporaneo della ricetta non ancora salvata

const statusEl = document.getElementById('sync-status');

function setSyncStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'sync-status ' + cls;
}

// ============================================================
// FIRESTORE
// ============================================================
async function initFirebase() {
  try {
    const docRef = db.collection('appData').doc('main');
    const docSnap = await docRef.get();

    if (!docSnap.exists) {
      await docRef.set({
        pantry: {},
        needed: {},
        recipes: [],
        ingredientBase: DEFAULT_INGREDIENTS
      });
      pantry = {};
      needed = {};
      recipes = [];
      ingredientBase = [...DEFAULT_INGREDIENTS];
    } else {
      const data = docSnap.data();
      pantry = data.pantry || {};
      needed = data.needed || {};
      recipes = data.recipes || [];
      ingredientBase = data.ingredientBase || [...DEFAULT_INGREDIENTS];
    }

    docRef.onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        pantry = data.pantry || {};
        needed = data.needed || {};
        recipes = data.recipes || [];
        ingredientBase = data.ingredientBase || [];
        renderAll();
        setSyncStatus('✅ Sincronizzato', 'ok');
      }
    }, (error) => {
      console.error('Errore listener:', error);
      setSyncStatus('❌ Errore sincronizzazione: ' + error.message, 'err');
    });

    firebaseReady = true;
    renderAll();
    updateDatalists();
    setSyncStatus('✅ Sincronizzato', 'ok');
  } catch (error) {
    console.error('Errore init Firebase:', error);
    setSyncStatus('❌ Errore Firebase: ' + error.message + ' — Controlla la configurazione', 'err');
  }
}

async function save() {
  if (!firebaseReady) return;
  try {
    setSyncStatus('💾 Salvataggio...', 'loading');
    await db.collection('appData').doc('main').set({
      pantry,
      needed,
      recipes,
      ingredientBase
    });
    setSyncStatus('✅ Sincronizzato', 'ok');
  } catch (error) {
    console.error('Errore save:', error);
    setSyncStatus('❌ Errore salvataggio: ' + error.message, 'err');
  }
}

// ============================================================
// UTILITÀ
// ============================================================
function capitalizeFirst(str) {
  str = str.trim();
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
}

function formatNumber(num) {
  // Arrotonda a 2 decimali
  const rounded = Math.round(num * 100) / 100;
  // Separa parte intera e decimale
  const parts = rounded.toString().split('.');
  // Aggiungi punti alle migliaia
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  // Unisci con virgola decimale (formato italiano)
  return parts.length > 1 ? parts[0] + ',' + parts[1] : parts[0];
}

function addToIngredientBase(name) {
  const capitalizedName = capitalizeFirst(name);
  if (!capitalizedName) return '';
  if (!ingredientBase.includes(capitalizedName)) {
    ingredientBase.push(capitalizedName);
    ingredientBase.sort((a, b) => a.localeCompare(b, 'it'));
    save();
    updateDatalists();
    renderBaseList('dispensa');
    renderBaseList('necessario');
    renderBaseList('ricette');
  }
  return capitalizedName;
}

function checkUnitMismatch(name, unit, currentSection) {
  const otherList = currentSection === 'dispensa' ? needed : pantry;
  const otherSectionName = currentSection === 'dispensa' ? 'Necessario' : 'Dispensa';
  if (otherList[name] && otherList[name].unit !== unit) {
    return {
      mismatch: true,
      message: `⚠️ Attenzione: "${name}" in ${otherSectionName} è in "${otherList[name].unit}", ma qui lo stai inserendo in "${unit}". Le unità di misura non corrispondono!`,
      otherUnit: otherList[name].unit
    };
  }
  return { mismatch: false, message: '', otherUnit: '' };
}

function toggleSuggestions(section) {
  const suggDiv = document.getElementById(`${section}-suggestions`);
  if (!suggDiv) return;
  if (suggDiv.style.display === 'none') {
    suggDiv.style.display = 'block';
    renderBaseList(section);
  } else {
    suggDiv.style.display = 'none';
  }
}

function renderBaseList(section) {
  const suggDiv = document.getElementById(`${section}-suggestions`);
  if (!suggDiv) return;
  if (ingredientBase.length === 0) {
    suggDiv.innerHTML = '<div class="empty" style="padding:10px;">Nessun ingrediente nella lista base</div>';
    return;
  }
  suggDiv.innerHTML = ingredientBase.map(ing => `
    <div class="base-item" onclick="selectFromBase('${section}', '${ing.replace(/'/g,"\\'")}')">${ing}</div>
  `).join('');
}

function selectFromBase(section, name) {
  if (section === 'dispensa') document.getElementById('ing-name').value = name;
  else if (section === 'necessario') document.getElementById('nec-name').value = name;
  else if (section === 'ricette') {
    const input = document.getElementById('recipe-ing-name');
    if (input) input.value = name;
  }
}

function renderAll() {
  renderPantry();
  renderNeeded();
  renderRecipesList();
  updateDatalists();
  if (document.getElementById('spesa').classList.contains('active')) {
    calculateShopping();
  }
}

function addToPantry() {
  let name = document.getElementById('ing-name').value.trim();
  const qty = parseFloat(document.getElementById('ing-qty').value);
  const unit = document.getElementById('ing-unit').value;
  if (!name || isNaN(qty) || qty <= 0) { alert('Compila nome e quantità!'); return; }

  name = addToIngredientBase(name);

  const check = checkUnitMismatch(name, unit, 'dispensa');
  if (check.mismatch) {
    if (!confirm(check.message + '\n\nVuoi comunque procedere?')) return;
  }

  if (pantry[name] && pantry[name].unit !== unit) {
    if (!confirm(`Attenzione: in dispensa "${name}" è in ${pantry[name].unit}. Vuoi sovrascrivere con ${unit}?`)) return;
  }
  pantry[name] = { qty, unit };
  save();
  renderAll();
  document.getElementById('ing-name').value = '';
  document.getElementById('ing-qty').value = '';
}

function removeFromPantry(name) {
  delete pantry[name];
  save();
  renderAll();
}

function clearPantry() {
  if (confirm('Sei sicuro di voler svuotare completamente la dispensa?')) {
    pantry = {};
    save();
    renderAll();
  }
}

function startEditPantry(oldName) {
  const item = pantry[oldName];
  if (!item) return;
  const list = document.getElementById('pantry-list');
  const div = list.querySelector(`[data-name="${CSS.escape(oldName)}"]`);
  if (!div) return;

  div.classList.add('editing');
  div.innerHTML = `
    <div style="font-weight:600; color:#b85c38;">✏️ Modifica ingrediente</div>
    <div class="edit-form-row">
      <input type="text" id="edit-pantry-name" value="${oldName.replace(/"/g,'&quot;')}" list="ing-list">
      <input type="number" id="edit-pantry-qty" value="${item.qty}" min="0" step="0.1">
      <select id="edit-pantry-unit">
        ${['pz','g','kg','ml','l','cucchiai','cucchiaini','confezioni'].map(u => `<option value="${u}" ${u===item.unit?'selected':''}>${u}</option>`).join('')}
      </select>
    </div>
    <div class="edit-form-actions">
      <button class="save" onclick="saveEditPantry('${oldName.replace(/'/g,"\\'")}')">✓ Salva</button>
      <button class="small" onclick="renderPantry()">✖ Annulla</button>
    </div>
  `;
  document.getElementById('edit-pantry-name').focus();
}

function saveEditPantry(oldName) {
  let newName = document.getElementById('edit-pantry-name').value.trim();
  const newQty = parseFloat(document.getElementById('edit-pantry-qty').value);
  const newUnit = document.getElementById('edit-pantry-unit').value;

  if (!newName || isNaN(newQty) || newQty <= 0) { alert('Compila nome e quantità!'); return; }

  newName = addToIngredientBase(newName);

  const checkName = (newName === oldName) ? oldName : newName;
  const check = checkUnitMismatch(checkName, newUnit, 'dispensa');
  if (check.mismatch) {
    if (!confirm(check.message + '\n\nVuoi comunque procedere?')) return;
  }

  if (newName !== oldName && pantry[newName]) {
    if (!confirm(`"${newName}" esiste già in dispensa (${pantry[newName].qty} ${pantry[newName].unit}). Vuoi unire?`)) return;
    delete pantry[oldName];
  } else if (newName !== oldName) {
    delete pantry[oldName];
  }

  pantry[newName] = { qty: newQty, unit: newUnit };
  save();
  renderAll();
}

function renderPantry() {
  const list = document.getElementById('pantry-list');
  const keys = Object.keys(pantry).sort((a, b) => a.localeCompare(b, 'it'));
  if (keys.length === 0) {
    list.innerHTML = '<div class="empty">Dispensa vuota. Aggiungi qualcosa!</div>';
    return;
  }
  list.innerHTML = keys.map(k => {
    const hasMismatch = needed[k] && needed[k].unit !== pantry[k].unit;
    const mismatchClass = hasMismatch ? ' mismatch' : '';
    const mismatchHint = hasMismatch ? `<div style="color:#e65100; font-size:12px; margin-top:3px;">⚠️ In Necessario è in "${needed[k].unit}"</div>` : '';
    return `
    <div class="item${mismatchClass}" data-name="${k.replace(/"/g,'&quot;')}">
      <div class="item-info">
        <div class="item-name">${k}</div>
        <div class="item-qty">${pantry[k].qty} ${pantry[k].unit}</div>
        ${mismatchHint}
      </div>
      <div class="item-actions">
        <button class="small edit" onclick="startEditPantry('${k.replace(/'/g,"\\'")}')">✏️</button>
        <button class="small danger" onclick="removeFromPantry('${k.replace(/'/g,"\\'")}')">🗑️</button>
      </div>
    </div>
  `;
  }).join('');
}

// RICETTE
// ============================================================
function newRecipe() {
  currentRecipeId = Date.now().toString();
  tempRecipeIngredients = [];
  selectedRecipeIngredients.clear();
  editingRecipeIngredientIndex = null;
  tempRecipeName = '';
  renderRecipeEditor();
  renderRecipesList();
}

function selectRecipe(id) {
  currentRecipeId = id;
  const recipe = recipes.find(r => r.id === id);
  if (recipe) {
    tempRecipeIngredients = [...recipe.ingredients];
    tempRecipeName = recipe.name;
  }
  selectedRecipeIngredients.clear();
  editingRecipeIngredientIndex = null;
  renderRecipeEditor();
  renderRecipesList();
}

function saveRecipe() {
  const nameInput = document.getElementById('recipe-name');
  const name = nameInput ? nameInput.value.trim() : tempRecipeName;
  if (!name) { alert('Inserisci il nome della ricetta!'); return; }

  tempRecipeName = name;

  const existingIndex = recipes.findIndex(r => r.id === currentRecipeId);
  if (existingIndex >= 0) {
    recipes[existingIndex] = { id: currentRecipeId, name, ingredients: [...tempRecipeIngredients] };
  } else {
    recipes.push({ id: currentRecipeId, name, ingredients: [...tempRecipeIngredients] });
  }

  save();
  renderRecipesList();
  alert('✅ Ricetta salvata!');
}

function deleteRecipe(id) {
  if (!confirm('Eliminare questa ricetta?')) return;
  recipes = recipes.filter(r => r.id !== id);
  if (currentRecipeId === id) {
    currentRecipeId = null;
    tempRecipeIngredients = [];
    selectedRecipeIngredients.clear();
    editingRecipeIngredientIndex = null;
    tempRecipeName = '';
  }
  save();
  renderRecipesList();
  renderRecipeEditor();
}

function duplicateRecipe(id) {
  const recipe = recipes.find(r => r.id === id);
  if (!recipe) return;
  const newId = Date.now().toString();
  recipes.push({ id: newId, name: recipe.name + ' (copia)', ingredients: [...recipe.ingredients] });
  save();
  renderRecipesList();
}

function addRecipeIngredient() {
  let name = document.getElementById('recipe-ing-name').value.trim();
  const qty = parseFloat(document.getElementById('recipe-ing-qty').value);
  const unit = document.getElementById('recipe-ing-unit').value;
  if (!name || isNaN(qty) || qty <= 0) { alert('Compila nome e quantità!'); return; }

  name = addToIngredientBase(name);
  tempRecipeIngredients.push({ name, qty, unit });
  
  const nameInput = document.getElementById('recipe-ing-name');
  const qtyInput = document.getElementById('recipe-ing-qty');
  if (nameInput) nameInput.value = '';
  if (qtyInput) qtyInput.value = '';
  renderRecipeEditor();
}

function removeRecipeIngredient(index) {
  tempRecipeIngredients.splice(index, 1);
  const newSet = new Set();
  selectedRecipeIngredients.forEach(i => {
    if (i > index) newSet.add(i - 1);
    else if (i < index) newSet.add(i);
  });
  selectedRecipeIngredients = newSet;
  editingRecipeIngredientIndex = null;
  renderRecipeEditor();
}

function toggleRecipeIngredientSelection(index) {
  if (selectedRecipeIngredients.has(index)) {
    selectedRecipeIngredients.delete(index);
  } else {
    selectedRecipeIngredients.add(index);
  }
  renderRecipeEditor();
}

function selectAllRecipeIngredients() {
  if (selectedRecipeIngredients.size === tempRecipeIngredients.length) {
    selectedRecipeIngredients.clear();
  } else {
    tempRecipeIngredients.forEach((_, i) => selectedRecipeIngredients.add(i));
  }
  renderRecipeEditor();
}

function addSelectedToNeeded() {
  if (selectedRecipeIngredients.size === 0) {
    alert('Seleziona almeno un ingrediente!');
    return;
  }

  let count = 0;
  selectedRecipeIngredients.forEach(index => {
    const ing = tempRecipeIngredients[index];
    if (!needed[ing.name]) {
      needed[ing.name] = { qty: ing.qty, unit: ing.unit };
    } else {
      needed[ing.name].qty += ing.qty;
    }
    count++;
  });

  save();
  selectedRecipeIngredients.clear();
  renderRecipeEditor();
  alert(`✅ ${count} ingrediente/i aggiunto/i al necessario!`);
}

function startEditRecipeIngredient(index) {
  editingRecipeIngredientIndex = index;
  renderRecipeEditor();
}

function saveEditRecipeIngredient(index) {
  let newName = document.getElementById(`edit-recipe-ing-name-${index}`).value.trim();
  const newQty = parseFloat(document.getElementById(`edit-recipe-ing-qty-${index}`).value);
  const newUnit = document.getElementById(`edit-recipe-ing-unit-${index}`).value;

  if (!newName || isNaN(newQty) || newQty <= 0) { alert('Compila nome e quantità!'); return; }

  newName = addToIngredientBase(newName);
  tempRecipeIngredients[index] = { name: newName, qty: newQty, unit: newUnit };
  editingRecipeIngredientIndex = null;
  renderRecipeEditor();
}

function cancelEditRecipeIngredient() {
  editingRecipeIngredientIndex = null;
  renderRecipeEditor();
}

function updateTempRecipeName(value) {
  tempRecipeName = value;
}

function renderRecipesList() {
  const list = document.getElementById('recipes-list');
  if (recipes.length === 0) {
    list.innerHTML = '<div class="empty">Nessuna ricetta salvata</div>';
    return;
  }
  list.innerHTML = recipes.map(r => `

  const editor = document.getElementById('recipe-editor');
  if (!currentRecipeId) {

    return;
  }

    <button onclick="saveRecipe()" style="width:100%; background:#4caf50; margin-top:10px;">💾 Salva ricetta</button>

  renderRecipeIngredientsList();

            </select>
          </div>

    }
    return `
      <div class="recipe-ingredient-item">
        <input type="checkbox" onchange="toggleRecipeIngredientSelection(${i})" ${selectedRecipeIngredients.has(i) ? 'checked' : ''}>
        <div class="recipe-ingredient-info">
          <div class="item-name">${ing.name}</div>
          <div class="item-qty">${ing.qty} ${ing.unit}</div>
        </div>
        <button class="small edit" onclick="startEditRecipeIngredient(${i})">✏️</button>
        <button class="small danger" onclick="removeRecipeIngredient(${i})">✖</button>
      </div>
    `;
  }).join('');
}

// ============================================================
// SPESA
// ============================================================
function toggleShoppingItem(name) {
  if (shoppingChecked.has(name)) {
    shoppingChecked.delete(name);
  } else {
    shoppingChecked.add(name);
  }
  calculateShopping();
}

function calculateShopping() {
  const result = document.getElementById('shopping-result');
  const exportContainer = document.getElementById('export-buttons-container');
  const neededKeys = Object.keys(needed);

  if (neededKeys.length === 0) {
    result.innerHTML = '<div class="empty">Lista del necessario vuota. Vai su "Necessario" per aggiungere gli ingredienti che ti servono.</div>';
    exportContainer.innerHTML = '';
    return;
  }

  const sorted = neededKeys.sort((a, b) => a.localeCompare(b, 'it'));
  const toBuy = [];
  const mismatch = [];

  sorted.forEach(name => {
    const need = needed[name];
    const have = pantry[name];

    if (have && have.unit !== need.unit) {
      mismatch.push({ name, need, have });
    } else {
      const haveQty = have ? have.qty : 0;
      const diff = need.qty - haveQty;
      if (diff > 0) {
        toBuy.push({ name, need, have, diff, unit: need.unit, checked: shoppingChecked.has(name) });
      }
    }
  });

  const currentNames = new Set(toBuy.map(item => item.name));
  shoppingChecked.forEach(name => {
    if (!currentNames.has(name)) {
      shoppingChecked.delete(name);
    }
  });

  const notChecked = toBuy.filter(item => !item.checked);
  const checked = toBuy.filter(item => item.checked);

  let html = '';

  if (mismatch.length > 0) {
    html += `<div class="mismatch-error">⚠️ Attenzione: ${mismatch.length} ingrediente/i ha unità di misura diverse tra Dispensa e Necessario. Correggi prima di poter calcolare la spesa per questi ingredienti.</div>`;
    html += '<h3 style="color:#c0392b; margin:15px 0 10px;">❌ Unità di misura da correggere</h3>';
    html += mismatch.map(s => `
      <div class="shopping-item mismatch">
        <div style="font-weight:600;">${s.name}</div>
        <div style="font-size:13px;">
          📦 In dispensa: <strong>${s.have.qty} ${s.have.unit}</strong><br>
          📋 Nel necessario: <strong>${s.need.qty} ${s.need.unit}</strong>
        </div>
      </div>
    `).join('');
  }

  if (notChecked.length > 0) {
    html += notChecked.map(s => `
      <div class="shopping-item">
        <div class="shopping-item-content">
          <input type="checkbox" onchange="toggleShoppingItem('${s.name.replace(/'/g,"\\'")}')" ${s.checked ? 'checked' : ''}>
          <div class="item-name">${s.name}</div>
        </div>
        <div style="font-weight:700; color:#e65100; font-size:18px;">${formatNumber(s.diff)} ${s.unit}</div>
      </div>
    `).join('');
  }

  if (checked.length > 0) {
    html += checked.map(s => `
      <div class="shopping-item checked">
        <div class="shopping-item-content">
          <input type="checkbox" onchange="toggleShoppingItem('${s.name.replace(/'/g,"\\'")}')" checked>
          <div class="item-name">${s.name}</div>
        </div>
        <div style="font-weight:700; color:#666; font-size:18px;">${formatNumber(s.diff)} ${s.unit}</div>
      </div>
    `).join('');
  }

  if (notChecked.length === 0 && checked.length === 0 && mismatch.length === 0) {
    html = '<div class="empty" style="background:#e8f5e9; border-radius:6px; padding:20px;">🎉 Hai già tutto in dispensa!</div>';
    exportContainer.innerHTML = '';
  } else {
    // Mostra pulsanti esportazione solo se ci sono articoli da comprare
    if (toBuy.length > 0) {
      exportContainer.innerHTML = `
        <div class="export-buttons">
          <button class="export-btn-copy" onclick="copyShoppingList()">📋 Copia lista</button>
          <button class="export-btn-share" onclick="shareShoppingList()">📱 Condividi</button>
          <button class="export-btn-open" onclick="openCheckableList()">📄 Apri lista spuntabile</button>
        </div>
      `;
    } else {
      exportContainer.innerHTML = '';
    }
  }

  result.innerHTML = html;
}

// ============================================================
// ESPORTAZIONE LISTA SPESA
// ============================================================
function getShoppingListData() {
  const neededKeys = Object.keys(needed);
  const items = [];
  
  neededKeys.forEach(name => {
    const need = needed[name];
    const have = pantry[name];
    
    if (have && have.unit !== need.unit) return;
    
    const haveQty = have ? have.qty : 0;
    const diff = need.qty - haveQty;
    
    if (diff > 0) {
      items.push({ name, qty: diff, unit: need.unit });
    }
  });
  
  return items.sort((a, b) => a.name.localeCompare(b.name, 'it'));
}

function copyShoppingList() {
  const items = getShoppingListData();
  if (items.length === 0) {
    alert('Nessun ingrediente da comprare!');
    return;
  }

  const text = '🛒 Lista della spesa\n\n' + 
    items.map(i => `☐ ${i.name} - ${formatNumber(i.qty)} ${i.unit}`).join('\n');

  navigator.clipboard.writeText(text).then(() => {
    alert('✅ Lista copiata negli appunti!');
  }).catch(err => {
    alert('❌ Errore nella copia: ' + err.message);
  });
}

function shareShoppingList() {
  const items = getShoppingListData();
  if (items.length === 0) {
    alert('Nessun ingrediente da comprare!');
    return;
  }

  const text = '🛒 Lista della spesa\n\n' + 
    items.map(i => `☐ ${i.name} - ${formatNumber(i.qty)} ${i.unit}`).join('\n');

  if (navigator.share) {
    navigator.share({
      title: 'Lista della spesa',
      text: text
    }).catch(err => {
      if (err.name !== 'AbortError') {
        alert('❌ Errore nella condivisione: ' + err.message);
      }
    });
  } else {
    alert('Condivisione non supportata dal browser. Usa "Copia lista" e incolla dove vuoi.');
  }
}

function openCheckableList() {
  const items = getShoppingListData();
  if (items.length === 0) {
    alert('Nessun ingrediente da comprare!');
    return;
  }

  const html = generateCheckableHTML(items);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function generateCheckableHTML(items) {
  return `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista della spesa</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f1ea;
    color: #333;
    padding: 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: #b85c38;
    margin-bottom: 20px;
    font-size: 24px;
  }
  .item {
    display: flex;
    align-items: center;
    padding: 15px;
    background: #fff3e0;
    border-radius: 8px;
    margin-bottom: 10px;
    border-left: 4px solid #ff9800;
    transition: all 0.3s;
  }
  .item.checked {
    background: #e8f5e9;
    border-left-color: #4caf50;
    opacity: 0.7;
  }
  .item.checked span {
    text-decoration: line-through;
    color: #666;
  }
  input[type="checkbox"] {
    width: 24px;
    height: 24px;
    margin-right: 15px;
    cursor: pointer;
  }
  span {
    font-size: 16px;
    font-weight: 500;
  }
  .summary {
    text-align: center;
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-radius: 8px;
    color: #666;
  }
  @media (max-width: 768px) {
    body { padding: 10px; }
    h1 { font-size: 20px; }
    .item { padding: 12px; }
    input[type="checkbox"] { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
  <h1>🛒 Lista della spesa</h1>
  <div id="list">
    ${items.map((item, i) => `
      <div class="item" id="item-${i}">
        <input type="checkbox" onchange="toggleItem(${i})" id="checkbox-${i}">
        <span>${item.name} - ${formatNumber(item.qty)} ${item.unit}</span>
      </div>
    `).join('')}
  </div>
  <div class="summary" id="summary">
    <span id="checked-count">0</span> / ${items.length} articoli spuntati
  </div>
  <script>
    let checkedCount = 0;
    const totalItems = ${items.length};

    function toggleItem(i) {
      const item = document.getElementById('item-' + i);
      const checkbox = document.getElementById('checkbox-' + i);
      
      if (checkbox.checked) {
        item.classList.add('checked');
        checkedCount++;
      } else {
        item.classList.remove('checked');
        checkedCount--;
      }
      
      document.getElementById('checked-count').textContent = checkedCount;
      
      // Salva stato in localStorage
      localStorage.setItem('shoppingListChecked', JSON.stringify(getCheckedItems()));
    }

    function getCheckedItems() {
      const checked = [];
      for (let i = 0; i < totalItems; i++) {
        const checkbox = document.getElementById('checkbox-' + i);
        if (checkbox && checkbox.checked) {
          checked.push(i);
        }
      }
      return checked;
    }

    // Ripristina stato salvato
    window.onload = function() {
      const saved = localStorage.getItem('shoppingListChecked');
      if (saved) {
        const checkedItems = JSON.parse(saved);
        checkedItems.forEach(i => {
          const checkbox = document.getElementById('checkbox-' + i);
          if (checkbox) {
            checkbox.checked = true;
            toggleItem(i);
          }
        });
      }
    };
  <\/script>
</body>
</html>`;
}

// ============================================================
// CALCOLATRICE CONVERSIONE UNITÀ
// ============================================================
function openConverter() {
  document.getElementById('converter-modal').classList.add('active');
  convert();
}

function closeConverter() {
  document.getElementById('converter-modal').classList.remove('active');
}

function swapUnits() {
  const from = document.getElementById('conv-from');
  const to = document.getElementById('conv-to');
  const temp = from.value;
  from.value = to.value;
  to.value = temp;
  convert();
}

function convert() {
  const value = parseFloat(document.getElementById('conv-value').value);
  const from = document.getElementById('conv-from').value;
  const to = document.getElementById('conv-to').value;
  const resultEl = document.getElementById('conv-result');

  if (isNaN(value) || value <= 0) {
    resultEl.textContent = 'Inserisci un valore';
    resultEl.className = 'conv-result';
    return;
  }

  if (from === to) {
    resultEl.textContent = `${formatNumber(value)} ${from} = ${formatNumber(value)} ${to}`;
    resultEl.className = 'conv-result';
    return;
  }

  const toBase = {
    'g': 1,
    'kg': 1000,
    'ml': 1,
    'l': 1000,
    'cucchiai': 15,
    'cucchiaini': 5,
    'pz': 1,
    'confezioni': 1
  };

  const weightUnits = ['g', 'kg', 'cucchiai', 'cucchiaini'];
  const volumeUnits = ['ml', 'l'];
  const countUnits = ['pz', 'confezioni'];

  const isFromWeight = weightUnits.includes(from);
  const isFromVolume = volumeUnits.includes(from);
  const isFromCount = countUnits.includes(from);
  const isToWeight = weightUnits.includes(to);
  const isToVolume = volumeUnits.includes(to);
  const isToCount = countUnits.includes(to);

  if ((isFromWeight && !isToWeight) || (isFromVolume && !isToVolume) || (isFromCount && !isToCount)) {
    resultEl.textContent = '⚠️ Unità incompatibili!';
    resultEl.className = 'conv-result error';
    return;
  }

  const baseValue = value * toBase[from];
  const result = baseValue / toBase[to];

  const rounded = Math.round(result * 100) / 100;
  resultEl.textContent = `${formatNumber(value)} ${from} = ${formatNumber(rounded)} ${to}`;
  resultEl.className = 'conv-result';
}
